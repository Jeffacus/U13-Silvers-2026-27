<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Westerhope U13 Silvers</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function () {
      try {
        var target = new URL('../', window.location.href);
        target.searchParams.set('app', '66');
        target.hash = window.location.hash;
        window.location.replace(target.href);
      } catch (e) {
        window.location.replace('../?app=66');
      }
    }());
  </script>
</head>
<body style="margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,sans-serif;display:grid;min-height:100vh;place-items:center;text-align:center;padding:24px;box-sizing:border-box">
  <div>
    <strong>Loading the latest Silvers app…</strong>
    <p><a href="../?app=66" style="color:#ffd500">Open the current site</a></p>
  </div>
</body>
</html>
