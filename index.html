    .latest-hero-overlay .eyebrow{color:#ffd500;letter-spacing:.14em}

    @media (max-width:700px){.latest-hero-button img{height:190px}.latest-hero-overlay{padding:22px 18px 16px}.latest-hero-overlay strong{font-size:1.05rem}.latest-hero-placeholder{min-height:145px}}
  </style>

<style>
.league-form-card .section-head{margin-bottom:12px}.league-chart-wrap{width:100%;overflow-x:auto;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.00));border-radius:16px;padding:6px 0}.league-chart-wrap svg{display:block;width:100%;min-width:740px;height:auto}.league-team-crest-end{cursor:pointer}.form-groups{display:grid;gap:12px;margin-top:16px}.form-group{border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:12px;background:rgba(255,255,255,.025)}.form-group-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}.form-group-head b{font-size:.95rem;color:#ffd500}.form-group-head span{font-size:.68rem;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.08em}.form-group-teams{display:flex;flex-wrap:wrap;gap:9px}.form-team-pill{appearance:none;border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:8px 10px;background:rgba(0,0,0,.18);color:#fff;display:flex;align-items:center;gap:8px;cursor:pointer;text-align:left;min-width:180px}.form-team-pill:hover,.form-team-pill.active{border-color:rgba(255,213,0,.55);box-shadow:0 0 0 1px rgba(255,213,0,.10) inset}.form-team-pill.our-team{border-color:rgba(255,213,0,.45)}.form-pill-crest{display:inline-flex;align-items:center;justify-content:center}.form-team-pill .table-crest{width:28px;height:28px;object-fit:contain}.form-pill-name{font-weight:700;font-size:.76rem;flex:1}.form-pill-meta{font-size:.62rem;color:rgba(255,255,255,.52);white-space:nowrap}@media (max-width:900px){.form-team-pill{min-width:0;flex:1 1 calc(50% - 8px)}.league-chart-wrap svg{min-width:720px}}@media (max-width:600px){.form-team-pill{flex-basis:100%}.league-chart-wrap{margin-left:-4px;margin-right:-4px}}

  <script src="data.js?v=43"></script>
  <script src="app.js?v=43"></script>

  <script>
  (() => {
    const CURRENT_BUILD = '43';
    const RELOAD_KEY = 'silvers-update-reload';

    async function checkForUpdate() {
      try {
        const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const v = await r.json();
        const latestBuild = String(v.build || '');
        if (!latestBuild || latestBuild === CURRENT_BUILD) return;

        // Silently reload once so the installed Home Screen app picks up the
        // newest HTML/JS without showing a permanent notification banner.
        const attempted = sessionStorage.getItem(RELOAD_KEY);
        if (attempted === latestBuild) return;
        sessionStorage.setItem(RELOAD_KEY, latestBuild);

        const u = new URL(window.location.href);
        u.searchParams.set('refresh', latestBuild + '-' + Date.now());
        window.location.replace(u.toString());
      } catch (e) {
        // Best effort only: never interrupt normal app use because an update check failed.
      }
    }

    // Clear the one-shot guard once we are on the current build.
    try {
      sessionStorage.removeItem(RELOAD_KEY);
    } catch (e) {}

    setTimeout(checkForUpdate, 700);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
    window.addEventListener('focus', checkForUpdate);
    setInterval(checkForUpdate, 60000);
  })();
  </script>
</body>
