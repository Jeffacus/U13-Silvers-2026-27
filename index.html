<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="U13 Silvers">
  <meta name="description" content="Westerhope United U13 Silvers 2026/27 season hub">
  <link rel="manifest" href="manifest.json?v=28">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=28">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=28">
  <link rel="stylesheet" href="styles.css?v=28">
  <title>Westerhope U13 Silvers</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <img class="club-header" src="assets/westerhope-header.png?v=21" alt="Westerhope United">
      <img class="team-header" src="assets/u13-silvers-header.png?v=21" alt="U13 Silvers">
      <div class="tagline"><span>PLAY</span><b>///</b><span>DEVELOP</span><b>///</b><span>BELONG</span><b>///</b></div>
    </header>

    <nav class="tabs" aria-label="Primary">
      <button class="tab active" data-view="home"><span>⌂</span><small>HOME</small></button>
      <button class="tab" data-view="matches"><span>▣</span><small>MATCHES</small></button>
      <button class="tab" data-view="players"><span>👥</span><small>PLAYERS</small></button>
      <button class="tab" data-view="stats"><span>▥</span><small>STATS</small></button>
      <button class="tab" data-view="table"><span>🏆</span><small>TABLE</small></button>
    </nav>

    <main id="app" class="content"></main>

    <footer class="footer">
      <div class="footer-mark">UP THE <span>HOPE</span> ///</div>
      <div class="footer-sub">MORE THAN A TEAM &nbsp; • &nbsp; A COMMUNITY</div>
    </footer>
  </div>
  <script src="data.js?v=29"></script>
  <script src="app.js?v=28"></script>

  <div id="update-banner" style="display:none;position:fixed;left:12px;right:12px;bottom:76px;z-index:9999;background:#111;border:1px solid #ffd400;border-radius:14px;padding:12px 14px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.45);align-items:center;gap:12px;justify-content:space-between;font-family:inherit">
    <div><b style="color:#ffd400">NEW UPDATE AVAILABLE</b><br><small>Tap refresh to load the latest Silvers information.</small></div>
    <button id="update-now" style="border:0;border-radius:10px;background:#ffd400;color:#050505;font-weight:900;padding:10px 12px">REFRESH</button>
  </div>
  <button id="manual-refresh" aria-label="Refresh latest data" style="display:none;position:fixed;right:14px;bottom:18px;z-index:9998;border:1px solid #555;border-radius:999px;background:#111;color:#fff;padding:9px 12px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.35)">↻ REFRESH</button>
  <script>
  (() => {
    const CURRENT_BUILD = '28';
    const banner = document.getElementById('update-banner');
    const updateNow = document.getElementById('update-now');
    const manual = document.getElementById('manual-refresh');
    let latestBuild = CURRENT_BUILD;

    function hardRefresh(build) {
      banner.style.display = 'none';
      const u = new URL(window.location.href);
      u.searchParams.set('refresh', build || Date.now().toString());
      window.location.replace(u.toString());
    }

    async function checkForUpdate(showIfCurrent = false) {
      try {
        const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
        if (!r.ok) throw new Error('version check failed');
        const v = await r.json();
        latestBuild = String(v.build || '');
        if (latestBuild && latestBuild !== CURRENT_BUILD) {
          banner.style.display = 'flex';
        } else {
          banner.style.display = 'none';
          if (showIfCurrent) {
          manual.textContent = '✓ UP TO DATE';
          setTimeout(() => manual.textContent = '↻ REFRESH', 1800);
          }
        }
      } catch (e) {
        if (showIfCurrent) hardRefresh(Date.now().toString());
      }
    }

    updateNow.addEventListener('click', () => hardRefresh(latestBuild));
    manual.addEventListener('click', async () => {
      manual.textContent = 'CHECKING…';
      await checkForUpdate(true);
      if (banner.style.display === 'flex') hardRefresh(latestBuild);
    });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
    window.addEventListener('focus', () => checkForUpdate());
    setTimeout(() => checkForUpdate(), 1200);
    setInterval(() => checkForUpdate(), 60000);
  })();
  </script>
</body>
</html>
