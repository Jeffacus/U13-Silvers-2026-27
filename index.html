<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="U13 Silvers">
  <meta name="description" content="Westerhope United U13 Silvers 2026/27 season hub">
  <link rel="manifest" href="manifest.json?v=28">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=28">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=28">
  <link rel="stylesheet" href="styles.css?v=28">
  <title>Westerhope U13 Silvers</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <img class="club-header" src="assets/westerhope-header.png?v=21" alt="Westerhope United">
      <img class="team-header" src="assets/u13-silvers-header.png?v=21" alt="U13 Silvers">
      <div class="tagline"><span>PLAY</span><b>///</b><span>DEVELOP</span><b>///</b><span>BELONG</span><b>///</b></div>
    </header>

    <nav class="tabs" aria-label="Primary">
      <button class="tab active" data-view="home"><span>⌂</span><small>HOME</small></button>
      <button class="tab" data-view="matches"><span>▣</span><small>MATCHES</small></button>
      <button class="tab" data-view="players"><span>👥</span><small>PLAYERS</small></button>
      <button class="tab" data-view="stats"><span>▥</span><small>STATS</small></button>
      <button class="tab" data-view="table"><span>🏆</span><small>TABLE</small></button>
    </nav>

    <main id="app" class="content"></main>

    <footer class="footer">
      <div class="footer-mark">UP THE <span>HOPE</span> ///</div>
      <div class="footer-sub">MORE THAN A TEAM &nbsp; • &nbsp; A COMMUNITY</div>
    </footer>
  </div>
  <script src="data.js?v=29"></script>
  <script src="app.js?v=28"></script>

  <script>
  (() => {
    const CURRENT_BUILD = '30';
    const RELOAD_KEY = 'silvers-update-reload';

    async function checkForUpdate() {
      try {
        const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) return;
        const v = await r.json();
        const latestBuild = String(v.build || '');
        if (!latestBuild || latestBuild === CURRENT_BUILD) return;

        // Silently reload once so the installed Home Screen app picks up the
        // newest HTML/JS without showing a permanent notification banner.
        const attempted = sessionStorage.getItem(RELOAD_KEY);
        if (attempted === latestBuild) return;
        sessionStorage.setItem(RELOAD_KEY, latestBuild);

        const u = new URL(window.location.href);
        u.searchParams.set('refresh', latestBuild + '-' + Date.now());
        window.location.replace(u.toString());
      } catch (e) {
        // Best effort only: never interrupt normal app use because an update check failed.
      }
    }

    // Clear the one-shot guard once we are on the current build.
    try {
      sessionStorage.removeItem(RELOAD_KEY);
    } catch (e) {}

    setTimeout(checkForUpdate, 700);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });
    window.addEventListener('focus', checkForUpdate);
    setInterval(checkForUpdate, 60000);
  })();
  </script>
</body>
</html>
